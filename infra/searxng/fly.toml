# Fly.io deployment for the production RealEstateGPT SearXNG instance.
#
# This is a persistent, always-on, HTTPS-terminated Docker deployment of the
# exact SearXNG configuration verified locally. Nothing here depends on a
# developer workstation.
#
# Prerequisites: flyctl installed and authenticated, Docker running locally.
#
# Exact deploy steps (also in infra/searxng/README.md):
#   1. cp fly.toml fly.toml.local   # fly.toml.local is gitignored
#   2. Edit fly.toml.local: replace CHANGE_ME_APP_NAME with a globally unique
#      name, e.g. realestategpt-searxng (this becomes <name>.fly.dev).
#   3. flyctl apps create <app-name>
#   4. flyctl deploy -c fly.toml.local
#   5. flyctl secrets set SEARXNG_SECRET=<output of: openssl rand -hex 32> \
#                         SEARXNG_AUTH_TOKEN=<output of: openssl rand -hex 32>
#      SEARXNG_SECRET is read natively by SearXNG's settings layer as
#      server.secret_key; SEARXNG_AUTH_TOKEN is the bearer token enforced by
#      the Caddy edge (and sent by the backend provider). The container
#      refuses to start without SEARXNG_AUTH_TOKEN.
#      Restart to apply: flyctl apps restart <app-name>
#   6. Set the same SEARXNG_AUTH_TOKEN + SEARXNG_BASE_URL=https://<app-name>.fly.dev
#      on the Vercel backend, then verify:
#      curl https://<app-name>.fly.dev/search?q=test&format=json          -> 401
#      curl -H "Authorization: Bearer <token>" \
#        "https://<app-name>.fly.dev/search?q=test&format=json"           -> 200 JSON
#
# Health check: Fly hits /healthz (allowed unauthenticated by the Caddyfile)
# every 30s and auto-restarts failing machines; `flyctl status` and
# `flyctl logs` give live state and logs.

app = "CHANGE_ME_APP_NAME"
primary_region = "bom" # Mumbai — close to the IN user base; change freely

[build]
  dockerfile = "Dockerfile.prod"

[http_service]
  internal_port = 8080 # Caddy; SearXNG itself is loopback-only on 8081
  force_https = true
  auto_stop_machines = "off" # always-on instance
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
