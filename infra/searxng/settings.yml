use_default_settings: true

general:
  debug: false
  instance_name: "RealEstateGPT-SearXNG"

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "realestategpt-searxng-local-key"
  base_url: "http://localhost:8080/"
  public_instance: false
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-XSS-Protection: 1; mode=block
    X-Download-Options: noopen
    X-Robots-Tag: noindex, nofollow

search:
  safe_search: 0
  autocomplete: ""
  default_lang: ""
  formats:
    - html
    - json

engines:
  - name: google
    engine: google
    shortcut: g
    disabled: false
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
  - name: bing
    engine: bing
    shortcut: b
    disabled: false
  - name: brave
    engine: brave
    shortcut: br
    disabled: false
