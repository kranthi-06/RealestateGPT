# SearXNG production settings template (RealEstateGPT).
#
# This file is baked into the production image by Dockerfile.prod. It is a
# TEMPLATE: the two CHANGE_ME values below must be replaced at deploy time.
# Never commit a copy of this file with real values.
#
#   server.secret_key  -> long random value, injected at runtime via the
#                         SEARXNG_SECRET env var (supported by the official
#                         image entrypoint) or baked into a host-local copy.
#   server.base_url    -> the public https URL of the deployed instance.
#
# Kept deliberately identical to the verified local settings.yml except for
# the production hardening called out in infra/searxng/README.md (https
# base_url, rotated secret, limiter).

use_default_settings: true

general:
  debug: false
  instance_name: "RealEstateGPT-SearXNG"

server:
  # SearXNG listens on loopback only; the Caddy token proxy in front of it is
  # the sole public surface (see Caddyfile / docker-entrypoint.prod.sh).
  port: 8081
  bind_address: "127.0.0.1"
  # Read natively by SearXNG's settings layer from the SEARXNG_SECRET env var
  # (settings_defaults.py maps server.secret_key -> SEARXNG_SECRET). The
  # placeholder below is never used when the env var is set via
  # `flyctl secrets set SEARXNG_SECRET=...`.
  secret_key: "CHANGE_ME_SET_VIA_SEARXNG_SECRET_ENV_VAR"
  base_url: "https://CHANGE_ME_SET_YOUR_PUBLIC_HOSTNAME/"
  public_instance: false
  # The built-in limiter is deliberately DISABLED: it caps format=json traffic
  # at API_MAX=4 requests/hour/IP (searx/botdetection/ip_limit.py) and 429s
  # non-browser user agents — it is designed to block bots, and would block
  # this platform's own headless backend. Restricted access is enforced at the
  # container edge instead: Caddy (see Caddyfile) requires the shared bearer
  # token (SEARXNG_AUTH_TOKEN) on every request except /healthz, and outbound
  # request volume is bounded by the backend's own verified rate limiter
  # (WEB_SEARCH_RPM floor + concurrency cap).
  limiter: false
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-XSS-Protection: 1; mode=block
    X-Download-Options: noopen
    X-Robots-Tag: noindex, nofollow

search:
  safe_search: 0
  autocomplete: ""
  default_lang: ""
  formats:
    - html
    - json

engines:
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
  - name: brave
    engine: brave
    shortcut: br
    disabled: false
    brave_category: search
    time_range_support: true
    paging: true
  - name: startpage
    engine: startpage
    shortcut: sp
    disabled: false
