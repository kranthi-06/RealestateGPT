[project]
name = "app"
version = "0.1.0"
dependencies = [ "fastapi==0.115.*", "uvicorn[standard]==0.34.*", "pydantic==2.10.*", "pydantic-settings==2.7.*", "pymongo==4.*", "python-jose[cryptography]==3.3.*", "passlib[bcrypt]==1.7.*", "python-multipart==0.0.*", "python-dotenv==1.1.*", "aiofiles==24.*", "httpx==0.28.*", "pytest==8.*" ]
requires-python = "~=3.13.0"

[tool.pytest.ini_options]
# Live provider/database checks are opt-in so a normal run spends no real
# quota:  pytest -m integration
markers = [
    "integration: live checks against real providers and databases (opt-in)",
]
